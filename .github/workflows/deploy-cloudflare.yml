name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: patientupdate-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_NAME: thateyeplace-patientupdate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Resolve Cloudflare account
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts)"
          account_id="$(jq -r 'if .success and (.result | length) == 1 then .result[0].id else empty end' <<< "$response")"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Resolve D1 database
        run: |
          database_id="$(npx wrangler d1 list --json | jq -r --arg name "$DATABASE_NAME" '.[] | select(.name == $name) | (.uuid // .id)' | head -n 1)"
          if [ -z "$database_id" ]; then
            npx wrangler d1 create "$DATABASE_NAME" --location enam
            database_id="$(npx wrangler d1 list --json | jq -r --arg name "$DATABASE_NAME" '.[] | select(.name == $name) | (.uuid // .id)' | head -n 1)"
          fi
          test -n "$database_id"
          jq --arg id "$database_id" --arg name "$DATABASE_NAME" \
            '.name="thateyeplace-patientupdate" | .compatibility_date="2026-08-21" | .d1_databases[0].database_name=$name | .d1_databases[0].database_id=$id' \
            dist/server/wrangler.json > dist/server/wrangler.deploy.json
      - name: Initialize database
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --config dist/server/wrangler.deploy.json --file db/schema.sql
      - name: Export current live records
        env:
          LEGACY_SITE_URL: https://patientupdate.anthonyperezabo.chatgpt.site
          LEGACY_PIN: ${{ secrets.LEGACY_PIN }}
        run: node scripts/export-legacy-data.mjs
      - name: Import live records with original timestamps
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --config dist/server/wrangler.deploy.json --file legacy-migration.sql
      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.deploy.json
      - name: Install access secret
        env:
          ACCESS_PIN: ${{ secrets.ACCESS_PIN }}
        run: |
          test -n "$ACCESS_PIN"
          printf '%s' "$ACCESS_PIN" | npx wrangler secret put ACCESS_PIN --config dist/server/wrangler.deploy.json
